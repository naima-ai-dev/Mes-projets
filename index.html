<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧭 Visualisateur de Labyrinthe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-bfs {
            background: #3b82f6;
            color: white;
        }

        .btn-bfs:hover {
            background: #2563eb;
        }

        .btn-dfs {
            background: #8b5cf6;
            color: white;
        }

        .btn-dfs:hover {
            background: #7c3aed;
        }

        .btn-reset {
            background: #6b7280;
            color: white;
        }

        .btn-reset:hover {
            background: #4b5563;
        }

        .stats {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            display: none;
        }

        .stats.show {
            display: block;
        }

        .stats h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-card {
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card.blue {
            background: #dbeafe;
        }

        .stat-card.yellow {
            background: #fef3c7;
        }

        .stat-card.green {
            background: #d1fae5;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .maze-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            overflow-x: auto;
        }

        #maze {
            display: inline-block;
        }

        .maze-row {
            display: flex;
            line-height: 0;
        }

        .cell {
            width: 45px;
            height: 45px;
            border: 1px solid #ddd;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .cell.wall {
            background: #1f2937;
            border-color: #111827;
        }

        .cell.passage {
            background: white;
        }

        .cell.start {
            background: #22c55e;
        }

        .cell.end {
            background: #ef4444;
        }

        .cell.visited {
            background: #93c5fd;
            animation: fadeIn 0.3s ease;
        }

        .cell.path {
            background: #fbbf24;
            animation: pulse 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .legend {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            border: 2px solid #333;
        }

        .legend-label {
            font-weight: 500;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .info-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        .info-box h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .info-box p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .info-box strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!--<header>
            <h1>🧭 Visualisateur de Labyrinthe</h1>
            <p class="subtitle">Algorithmes de recherche de chemin - DFS vs BFS</p>
        </header>-->

        <div class="controls">
            <button class="btn-bfs" onclick="resoudre('bfs')">
                 BFS (Largeur)
            </button>
            <button class="btn-dfs" onclick="resoudre('dfs')">
                 DFS (Profondeur)
            </button>
            <button class="btn-reset" onclick="reinitialiser()">
                Réinitialiser
            </button>
        </div>

        <div class="stats" id="stats">
            <h2> Résultats</h2>
            <div class="stats-grid">
                <div class="stat-card blue">
                    <div class="stat-value" id="stat-visited">0</div>
                    <div class="stat-label">Cases visitées</div>
                </div>
                <div class="stat-card yellow">
                    <div class="stat-value" id="stat-path">0</div>
                    <div class="stat-label">Longueur du chemin</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-value" id="stat-algo">-</div>
                    <div class="stat-label">Algorithme utilisé</div>
                </div>
            </div>
        </div>

        <div class="maze-container">
            <div id="maze"></div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #22c55e;"></div>
                <span class="legend-label"> Départ</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #ef4444;"></div>
                <span class="legend-label"> Arrivée</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #1f2937;"></div>
                <span class="legend-label">Mur</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #93c5fd;"></div>
                <span class="legend-label">Visité</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #fbbf24;"></div>
                <span class="legend-label">Chemin final</span>
            </div>
        </div>
    </div>

    <script>
        let labyrintheData = null;
        let isAnimating = false;

        // Charger le labyrinthe au démarrage
        window.onload = function() {
            chargerLabyrinthe();
        };

        // Charger les données du labyrinthe depuis le serveur Python
        async function chargerLabyrinthe() {
            try {
                const response = await fetch('http://localhost:5000/api/labyrinthe');
                labyrintheData = await response.json();
                afficherLabyrinthe();
            } catch (error) {
                document.getElementById('maze').innerHTML = 
                    '<div class="loading"> Erreur: Le serveur Python n\'est pas démarré.<br>Lancez "python app.py" dans le terminal.</div>';
                console.error('Erreur:', error);
            }
        }

        // Afficher le labyrinthe
        function afficherLabyrinthe(visitees = [], chemin = []) {
            if (!labyrintheData) return;

            const mazeDiv = document.getElementById('maze');
            mazeDiv.innerHTML = '';

            const depart = labyrintheData.depart;
            const arrivee = labyrintheData.arrivee;

            labyrintheData.matrice.forEach((ligne, i) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'maze-row';

                ligne.forEach((cellule, j) => {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'cell';

                    const isStart = i === depart[0] && j === depart[1];
                    const isEnd = i === arrivee[0] && j === arrivee[1];
                    const isVisited = visitees.some(v => v[0] === i && v[1] === j);
                    const isPath = chemin.some(p => p[0] === i && p[1] === j);

                    if (cellule === 1) {
                        cellDiv.classList.add('wall');
                    } else if (isStart) {
                        cellDiv.classList.add('start');
                        cellDiv.textContent = '';
                    } else if (isEnd) {
                        cellDiv.classList.add('end');
                        cellDiv.textContent = '';
                    } else if (isPath) {
                        cellDiv.classList.add('path');
                    } else if (isVisited) {
                        cellDiv.classList.add('visited');
                    } else {
                        cellDiv.classList.add('passage');
                    }

                    rowDiv.appendChild(cellDiv);
                });

                mazeDiv.appendChild(rowDiv);
            });
        }

        // Résoudre le labyrinthe avec animation
        async function resoudre(algorithme) {
            if (isAnimating) return;
            
            isAnimating = true;
            desactiverBoutons(true);
            reinitialiser();

            try {
                const response = await fetch(`http://localhost:5000/api/resoudre/${algorithme}`);
                const resultat = await response.json();

                if (!resultat.trouve) {
                    alert(' Aucun chemin trouvé !');
                    return;
                }

                // Animer les cases visitées
                for (let i = 0; i < resultat.visitees.length; i++) {
                    afficherLabyrinthe(resultat.visitees.slice(0, i + 1), []);
                    await sleep(30);
                }

                // Animer le chemin final
                for (let i = 0; i < resultat.chemin.length; i++) {
                    afficherLabyrinthe(resultat.visitees, resultat.chemin.slice(0, i + 1));
                    await sleep(50);
                }

                // Afficher les statistiques
                afficherStats(resultat);

            } catch (error) {
                alert(' Erreur de connexion au serveur Python.\nAssurez-vous que "python app.py" est en cours d\'exécution.');
                console.error('Erreur:', error);
            } finally {
                isAnimating = false;
                desactiverBoutons(false);
            }
        }

        // Afficher les statistiques
        function afficherStats(resultat) {
            document.getElementById('stats').classList.add('show');
            document.getElementById('stat-visited').textContent = resultat.cases_visitees;
            document.getElementById('stat-path').textContent = resultat.longueur_chemin;
            document.getElementById('stat-algo').textContent = resultat.algorithme.split(' ')[0];
        }

        // Réinitialiser l'affichage
        function reinitialiser() {
            document.getElementById('stats').classList.remove('show');
            afficherLabyrinthe();
        }

        // Désactiver/activer les boutons
        function desactiverBoutons(desactive) {
            const boutons = document.querySelectorAll('button');
            boutons.forEach(btn => btn.disabled = desactive);
        }

        // Fonction sleep pour l'animation
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
